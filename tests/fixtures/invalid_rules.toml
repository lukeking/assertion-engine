expression = "altitude_m < 1e3"
line = 1
column = 14
end_column = 17
fragment = "1e3"

[[case]]
code = "invalid_number"
expression = "battery_percent > 2."
line = 1
column = 19
end_column = 21
fragment = "2."

[[case]]
code = "invalid_number"
expression = "count < 2.5.1"
line = 1
column = 9
end_column = 14
fragment = "2.5.1"

