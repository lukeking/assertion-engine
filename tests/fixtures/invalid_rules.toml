# SC-005 regression suite (data-model.md "Regression suite files"): every
# diagnostic code, at least 2 cases each.
#
# A case has a `code`, either an `expression` or a whole `ruleset`, and its
# expected location, counted by hand:
# - `line`, `column`, `end_column`, `fragment`: positions within the expression
#   string. An `expression` case is rule `case` of the test's minimal rule set;
#   a `ruleset` case names the `rule` or `derived` that owns the expression.
#   A location at the end of the text is one column wide, fragment "".
# - `file_line`, `file_column`: the rule-set file; outside TOML syntax errors,
#   the start of the line that defines the offending key or table.

# lexer

[[case]]
code = "invalid_character"
expression = "battery_percent ≥ limit_percent"
line = 1
column = 17
end_column = 18
fragment = "≥"

[[case]]
code = "invalid_character"
expression = "altitude_m < limit_m and\n  count > 0;"
line = 2
column = 12
end_column = 13
fragment = ";"

[[case]]
code = "invalid_character"
expression = "limit_m = altitude_m"
line = 1
column = 9
end_column = 10
fragment = "="

[[case]]
